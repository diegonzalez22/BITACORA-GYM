<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14171B">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="Bitácora">
<title>Bitácora de cargas</title>
<style>
  :root{
    --iron:#14171B; --surface:#1D222A; --surfaceHi:#262D37; --line:#333C48;
    --chalk:#ECE8E1; --mute:#8B95A3; --blue:#3E7CB1; --amber:#D8A430;
    --red:#B04A3C; --green:#8FD3A8; --greenBg:#1E2B25; --oro:#E8C25A;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--iron);color:var(--chalk);
    font-family:-apple-system,'Helvetica Neue',Helvetica,system-ui,sans-serif;
    padding-bottom:60px}
  .wrap{max-width:560px;margin:0 auto;padding:20px 16px;
    padding-top:calc(20px + env(safe-area-inset-top))}
  h1{font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1;margin:0}
  .sub{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:13px;
    color:var(--mute);flex-wrap:wrap}
  .estado{font-size:12px;font-weight:600}
  .ok{color:var(--green)} .err{color:#E39A8E}
  .tabs{display:flex;gap:3px;background:var(--surface);padding:4px;border-radius:8px;margin:18px 0}
  .tabs button{flex:1;background:transparent;color:var(--mute);border:none;border-radius:6px;
    padding:10px 0;font-size:13px;font-weight:600;font-family:inherit}
  .tabs button.on{background:var(--surfaceHi);color:var(--chalk)}
  .dias{display:flex;gap:4px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px}
  .dias button{flex:1 0 auto;min-width:44px;background:var(--surface);color:var(--mute);
    border:1px solid var(--line);border-radius:6px;padding:9px 6px;font-size:13px;
    font-weight:600;font-family:inherit}
  .dias button.tiene{color:var(--chalk)}
  .dias button.on{background:var(--blue);border-color:var(--blue);color:var(--chalk)}
  .chip{background:var(--surface);color:var(--chalk);border:1px solid var(--line);
    border-radius:20px;padding:8px 14px;font-size:14px;font-family:inherit;
    display:inline-flex;align-items:center;gap:7px}
  .chip.on{background:var(--blue);border-color:var(--blue)}
  .chip img{width:26px;height:26px;border-radius:13px;object-fit:cover}
  .chip.foto{padding-left:6px}
  .pto{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 8px}
  .dash{background:transparent;color:var(--mute);border:1px dashed var(--line);
    border-radius:20px;padding:8px 14px;font-size:14px;font-family:inherit}
  .fila{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
  input,select,textarea{background:var(--iron);border:1px solid var(--line);color:var(--chalk);
    border-radius:6px;padding:10px 12px;font-size:16px;width:100%;outline:none;
    font-variant-numeric:tabular-nums;font-family:inherit}
  textarea{resize:vertical;min-height:54px;font-size:14px;line-height:1.45}
  .btn{background:var(--blue);color:var(--chalk);border:none;border-radius:6px;
    padding:12px 16px;font-size:15px;font-weight:600;font-family:inherit;width:100%}
  .btn.gris{background:var(--surfaceHi)}
  .link{background:transparent;border:none;color:var(--blue);font-size:14px;
    font-weight:600;font-family:inherit;padding:6px 0}
  .link.rojo{color:var(--red);font-size:13px}
  .link.gris{color:var(--mute);font-size:13px}
  .vacio{border:1px dashed var(--line);border-radius:8px;padding:22px;text-align:center;
    color:var(--mute);font-size:14px}
  .label{font-size:13px;color:var(--mute);margin-bottom:8px}
  .card{background:var(--surface);border-radius:8px;padding:12px 14px;margin-bottom:8px}
  .cardVerde{background:var(--greenBg);border-left:3px solid #6BBF8A;border-radius:0 8px 8px 0;
    padding:12px 14px;margin-bottom:14px}
  .cardAmbar{background:var(--surface);border-left:3px solid var(--amber);
    border-radius:0 8px 8px 0;padding:12px 14px;margin-bottom:18px}
  .cardRoja{background:#3A2220;color:#E39A8E;padding:12px 14px;border-radius:6px;
    font-size:13px;margin-bottom:16px;line-height:1.5}
  .serieFila{display:flex;gap:8px;align-items:center}
  .num{width:22px;color:var(--mute);font-size:14px;font-variant-numeric:tabular-nums;flex:0 0 22px}
  .x{background:transparent;color:var(--mute);border:none;font-size:20px;padding:0 6px;font-family:inherit}
  .conv{margin-left:30px;margin-top:3px;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
  .sets{display:flex;flex-wrap:wrap;gap:10px 18px;font-variant-numeric:tabular-nums}
  .sets .p{font-size:15px}
  .sets .e{font-size:11px;color:var(--mute);margin-top:1px}
  .cab{display:flex;justify-content:space-between;align-items:baseline;
    padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:10px}
  .seg{display:flex;gap:2px;background:var(--surface);padding:2px;border-radius:6px}
  .seg button{background:transparent;color:var(--mute);border:none;border-radius:4px;
    padding:5px 14px;font-size:13px;font-weight:600;font-family:inherit}
  .seg button.on{background:var(--blue);color:var(--chalk)}
  .stats{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
  .stat{flex:1;min-width:92px;background:var(--surface);border-radius:8px;padding:12px 10px}
  .stat b{font-size:19px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;display:block}
  .stat span{font-size:11px;color:var(--mute);display:block;margin-top:2px}
  .pie{margin-top:36px;padding-top:20px;border-top:1px solid var(--line)}
  .pie .btn{flex:1;width:auto}
  .lupa{position:fixed;inset:0;background:rgba(10,12,14,.94);display:flex;
    align-items:center;justify-content:center;padding:20px;z-index:60}
  .lupa img{max-width:100%;max-height:100%;border-radius:10px}
  .pr{background:var(--oro);color:#14171B;font-size:10px;font-weight:800;
    letter-spacing:.06em;padding:3px 7px;border-radius:10px;text-transform:uppercase}
  .titGrupo{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    margin:14px 0 8px}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cal .dh{font-size:10px;color:var(--mute);text-align:center;padding-bottom:4px;font-weight:600}
  .cal .d{aspect-ratio:1;border-radius:6px;background:var(--surface);display:flex;
    flex-direction:column;align-items:center;justify-content:center;font-size:12px;
    color:var(--mute);font-variant-numeric:tabular-nums}
  .cal .d.act{background:var(--blue);color:var(--chalk);font-weight:700}
  .cal .d.hoy{border:1.5px solid var(--amber)}
  .cal .d.fuera{opacity:.2}
  .cal .d.desc{background:transparent;border:1px solid var(--line)}
  .entreno{position:fixed;inset:0;background:var(--iron);z-index:55;overflow-y:auto;
    padding:calc(18px + env(safe-area-inset-top)) 16px 40px}
  button{cursor:pointer}
  .oculto{display:none}
  .barra{height:8px;border-radius:4px;background:var(--surfaceHi);overflow:hidden}
  .barra i{display:block;height:100%;border-radius:4px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="capa"></div>
<input type="file" id="inFoto" accept="image/*" capture="environment" class="oculto">
<input type="file" id="inJson" accept="application/json,.json" class="oculto">

<script>
/* ===================== CONSTANTES ===================== */
var LLAVE="bitacora-gym-v1";
var KG_POR_LB=0.45359237;
var DIAS=[{i:0,c:"Lun",l:"Lunes"},{i:1,c:"Mar",l:"Martes"},{i:2,c:"Mié",l:"Miércoles"},
 {i:3,c:"Jue",l:"Jueves"},{i:4,c:"Vie",l:"Viernes"},{i:5,c:"Sáb",l:"Sábado"},{i:6,c:"Dom",l:"Domingo"}];
var MESES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
var MESES_L=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto",
 "Septiembre","Octubre","Noviembre","Diciembre"];
var GRUPOS=[
 {id:"pierna", label:"Pierna",           color:"#5B8DD9"},
 {id:"pecho",  label:"Pecho",            color:"#D95B5B"},
 {id:"espalda",label:"Espalda",          color:"#5BD98A"},
 {id:"hombro", label:"Hombro",           color:"#D9A45B"},
 {id:"biceps", label:"Bíceps / Tríceps", color:"#A45BD9"},
 {id:"core",   label:"Core / Abdomen",   color:"#5BD9D9"},
 {id:"cardio", label:"Cardio",           color:"#E8724F"},
 {id:"otro",   label:"Sin clasificar",   color:"#8B95A3"}];

/* ===================== UTILIDADES ===================== */
function hoyISO(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function diaDeISO(iso){return (new Date(iso+"T00:00:00").getDay()+6)%7;}
function fmtFecha(iso){var p=iso.split("-");return p[2]+" "+MESES[+p[1]-1]+" "+p[0];}
function uid(){return Math.random().toString(36).slice(2,10);}
function esc(t){return String(t==null?"":t).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function nfmt(n){return Math.round(n).toLocaleString("es-MX");}
/* el teclado en español escribe coma: la convertimos a punto */
function numTxt(v){return String(v==null?"":v).replace(",",".");}
function n1(n){return (Math.round(n*10)/10).toLocaleString("es-MX");}
function uni(s){return s.u||"kg";}
function enKg(s){return uni(s)==="lb"?(+s.w||0)*KG_POR_LB:(+s.w||0);}
function equiv(v,u){var n=parseFloat(v);if(isNaN(n))return "";
  return u==="lb"?(n*KG_POR_LB).toFixed(1)+" kg":(n/KG_POR_LB).toFixed(1)+" lb";}
function volumen(sets){return (sets||[]).reduce(function(a,s){return a+enKg(s)*(+s.r||0);},0);}
function maxKg(sets){return (sets||[]).reduce(function(a,s){return Math.max(a,enKg(s));},0);}
function rm1(sets){return (sets||[]).reduce(function(a,s){
  var r=+s.r||0,k=enKg(s); if(!k||!r) return a;
  return Math.max(a,k*(1+r/30));},0);}
function labelGrupo(id){var g=GRUPOS.filter(function(x){return x.id===id;})[0];return g?g.label:"Sin clasificar";}
function colorGrupo(id){var g=GRUPOS.filter(function(x){return x.id===id;})[0];return g?g.color:"#8B95A3";}
function ritmo(c){var d=+c.dist||0,m=+c.min||0;if(!d||!m)return null;return m/d;}
function fmtRitmo(r){if(r==null)return "—";var m=Math.floor(r),s=Math.round((r-m)*60);
  if(s===60){m++;s=0;} return m+"'"+String(s).padStart(2,"0")+'"';}
function velocidad(c){var d=+c.dist||0,m=+c.min||0;if(!d||!m)return null;return d/(m/60);}
function esCardio(ej){return !!(ej&&ej.tipo==="cardio");}
function sesCardio(s){return !!s.cardio;}

/* ===================== ESTADO ===================== */
var S={ejercicios:[],sesiones:[],etiquetas:{},unidad:"kg",fotos:{},jornadas:{},peso:[],ordenDias:{}};
var U={vista:"hoy",diaSel:diaDeISO(hoyISO()),activo:null,fecha:hoyISO(),
       series:[{w:"",r:""}],cardio:{min:"",dist:"",nivel:"",fc:"",ritmo:"",ritmoU:"kmh"},
       nuevo:false,grupoNuevo:"otro",tipoNuevo:"fuerza",editEtiqueta:false,
       ejGrafica:null,grupoFiltro:null,busca:"",lupa:null,aviso:null,
       estado:"ok",detalle:"",calMes:null,entreno:null,pesoIn:"",
       editandoNombre:null,timer:null,timerSeg:90,diasAbiertos:{},ordenDiaSel:null,nombreNuevo:"",
       moviendoFecha:false,nuevaFecha:""};

/* ===================== PERSISTENCIA ===================== */
function guardar(){
  try{
    localStorage.setItem(LLAVE,JSON.stringify(S));
    var v=localStorage.getItem(LLAVE);
    if(!v){U.estado="error";U.detalle="el navegador no devolvió lo guardado";}
    else {U.estado="ok";U.detalle="";}
  }catch(e){U.estado="error";U.detalle=(e&&e.name||"Error")+": "+(e&&e.message||e);}
}
function cargar(){
  try{
    var v=localStorage.getItem(LLAVE);
    if(v){
      var d=JSON.parse(v);
      S.ejercicios=(d.ejercicios||[]).map(function(e){
        var dias=Array.isArray(e.dias)?e.dias:
          (e.dia!==null&&e.dia!==undefined?[e.dia]:[]);
        return {id:e.id,nombre:e.nombre,dias:dias,
                grupo:e.grupo||"otro",tipo:e.tipo||"fuerza",nota:e.nota||""};});
      S.sesiones=d.sesiones||[];
      S.etiquetas=d.etiquetas||{};
      S.unidad=d.unidad||"kg";
      S.fotos=d.fotos||{};
      S.jornadas=d.jornadas||{};
      S.peso=d.peso||[];
      S.ordenDias=d.ordenDias||{};
      /* migrar: si no hay ordenDias, construirlo desde el orden actual del array */
      var sinOrden=Object.keys(S.ordenDias).length===0;
      if(sinOrden){
        DIAS.forEach(function(dia){
          S.ordenDias[dia.i]=S.ejercicios
            .filter(function(e){return e.dias&&e.dias.indexOf(dia.i)>=0;})
            .map(function(e){return e.id;});
        });
      }
    }
    U.estado="ok";
  }catch(e){U.estado="error";U.detalle="No se pudo leer lo guardado: "+(e&&e.message||e);}
}
function aviso(m,err){U.aviso={m:m,e:!!err};render();
  setTimeout(function(){U.aviso=null;render();},2800);}

/* ===================== DERIVADOS ===================== */
function ejDe(id){return S.ejercicios.filter(function(x){return x.id===id;})[0]||null;}
function nombreDe(id){var e=ejDe(id);return e?e.nombre:"Ejercicio borrado";}
function listaVisible(){
  if(U.busca.trim()){
    var q=U.busca.trim().toLowerCase();
    return S.ejercicios.filter(function(e){return e.nombre.toLowerCase().indexOf(q)>=0;});
  }
  return S.ejercicios.filter(function(e){
    return U.diaSel===null?(e.dias&&e.dias.length===0):
      (e.dias&&e.dias.indexOf(U.diaSel)>=0);});
}
function sinDia(){return S.ejercicios.filter(function(e){return !e.dias||e.dias.length===0;});}
function yaRegistrado(){if(!U.activo)return null;
  return S.sesiones.filter(function(s){return s.ejercicioId===U.activo&&s.fecha===U.fecha;})[0]||null;}
function ultimaDe(id,antesDe){
  return S.sesiones.filter(function(s){return s.ejercicioId===id&&s.fecha!==antesDe;})
    .sort(function(a,b){return a.fecha<b.fecha?1:-1;})[0]||null;}
function sesionesDe(id){return S.sesiones.filter(function(s){return s.ejercicioId===id;})
    .sort(function(a,b){return a.fecha>b.fecha?1:-1;});}
function porFecha(){var m={};S.sesiones.forEach(function(s){(m[s.fecha]=m[s.fecha]||[]).push(s);});
  return Object.keys(m).sort(function(a,b){return a<b?1:-1;}).map(function(f){return [f,m[f]];});}
function volDia(l){return l.reduce(function(a,s){return a+(sesCardio(s)?0:volumen(s.sets));},0);}
function minCardioDia(l){return l.reduce(function(a,s){return a+(sesCardio(s)?(+s.cardio.min||0):0);},0);}
function esRecord(s){
  if(sesCardio(s))return false;
  var mio=rm1(s.sets); if(!mio) return false;
  var previas=S.sesiones.filter(function(x){
    return x.ejercicioId===s.ejercicioId && !sesCardio(x) && x.fecha<s.fecha;});
  if(!previas.length) return false;
  var mejor=previas.reduce(function(a,x){return Math.max(a,rm1(x.sets));},0);
  return mio>mejor+0.01;
}
function recordDe(id){
  return sesionesDe(id).reduce(function(a,s){return Math.max(a,sesCardio(s)?0:rm1(s.sets));},0);}
function estancado(id){
  var ss=sesionesDe(id).filter(function(s){return !sesCardio(s);});
  if(ss.length<4) return 0;
  var mejor=0,idx=-1;
  ss.forEach(function(s,i){var v=rm1(s.sets); if(v>mejor+0.01){mejor=v;idx=i;}});
  if(idx<0) return 0;
  return idx>=4?idx:0;
}
function sinGuardar(){
  var y=yaRegistrado(),ej=ejDe(U.activo);
  if(esCardio(ej)){
    var a=[U.cardio.min,U.cardio.dist,U.cardio.nivel,U.cardio.fc,U.cardio.ritmo]
      .map(function(v){return v===""?"":String(+v);}).join("|")+"|"+(U.cardio.ritmoU||"kmh");
    var c=(y&&y.cardio)?[y.cardio.min,y.cardio.dist,y.cardio.nivel,y.cardio.fc,y.cardio.ritmo]
      .map(function(v){return (v===""||v==null)?"":String(+v);}).join("|")+"|"+(y.cardio.ritmoU||"kmh")
      :"|||||kmh";
    return a!==c;
  }
  var x=U.series.filter(function(s){return s.w!==""&&s.r!=="";})
    .map(function(s){return (+s.w)+"|"+(+s.r)+"|"+S.unidad;}).join(",");
  var b=(y&&y.sets)?y.sets.map(function(z){return (+z.w)+"|"+(+z.r)+"|"+uni(z);}).join(","):"";
  return x!==b;
}
function cargarBorrador(){
  var y=yaRegistrado(),ej=ejDe(U.activo);
  if(esCardio(ej)){
    U.cardio=(y&&y.cardio)?{min:String(y.cardio.min||""),dist:String(y.cardio.dist||""),
      nivel:(y.cardio.nivel==null?"":String(y.cardio.nivel)),
      fc:(y.cardio.fc==null?"":String(y.cardio.fc)),
      ritmo:(y.cardio.ritmo==null?"":String(y.cardio.ritmo)),
      ritmoU:(y.cardio.ritmoU||"kmh")}:{min:"",dist:"",nivel:"",fc:"",ritmo:"",ritmoU:"kmh"};
    U.series=[{w:"",r:""}];
  } else {
    U.series=(y&&y.sets)?y.sets.map(function(x){return {w:String(x.w),r:String(x.r)};}):[{w:"",r:""}];
    if(y&&y.sets&&y.sets.length) S.unidad=uni(y.sets[0]);
  }
}

/* ===================== ACCIONES ===================== */
function crearEjercicio(nombre){
  nombre=(nombre||"").trim(); if(!nombre) return;
  var tipo=U.tipoNuevo||"fuerza";
  var e={id:uid(),nombre:nombre,dias:(U.diaSel===null?[]:[U.diaSel]),
         grupo:tipo==="cardio"?"cardio":(U.grupoNuevo||"otro"),tipo:tipo,nota:""};
  S.ejercicios.push(e);
  U.activo=e.id;U.nuevo=false;U.grupoNuevo="otro";U.tipoNuevo="fuerza";U.busca="";U.nombreNuevo="";
  cargarBorrador();guardar();render();
}
/* ---- renombrar ---- */
function renombrarEjercicio(id,nombre){
  nombre=(nombre||"").trim(); if(!nombre) return;
  var e=ejDe(id); if(!e) return;
  e.nombre=nombre; U.editandoNombre=null; guardar(); render();
}
/* ---- reordenar (flechas) ---- */
function moverEnDia(id,dia,dir){
  var ord=S.ordenDias[dia]; if(!ord) return;
  var idx=ord.indexOf(id); if(idx<0) return;
  var destino=idx+dir;
  if(destino<0||destino>=ord.length) return;
  var tmp=ord[idx]; ord[idx]=ord[destino]; ord[destino]=tmp;
  guardar(); render();
}
/* ---- temporizador de descanso ---- */
var _timerIv=null;
function iniciarTimer(){
  clearInterval(_timerIv);
  U.timer=U.timerSeg;
  render();
  _timerIv=setInterval(function(){
    U.timer--;
    if(U.timer<=0){
      clearInterval(_timerIv); _timerIv=null; U.timer=0;
      if(navigator.vibrate) navigator.vibrate([400,200,400]);
    }
    var z=document.getElementById("timer");
    if(z) z.innerHTML=hTimer();
  },1000);
}
function detenerTimer(){ clearInterval(_timerIv); _timerIv=null; U.timer=null; render(); }
function hTimer(){
  if(U.timer===null) return "";
  var s=U.timer, col=s<=5?"#D95B5B":s<=10?"#D8A430":"#8FD3A8";
  var pc=Math.round(s/U.timerSeg*100);
  return '<div style="background:var(--surface);border-radius:8px;padding:12px 14px;margin-top:14px">'
   + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">'
   + '<span style="font-size:13px;color:var(--mute)">Descanso</span>'
   + '<div style="display:flex;gap:10px;align-items:center">'
   + [60,90,120].map(function(v){return '<button data-tseg="'+v+'" style="background:'+(U.timerSeg===v?"var(--surfaceHi)":"transparent")+';color:'+(U.timerSeg===v?"var(--chalk)":"var(--mute)")+';border:none;font-size:12px;font-weight:600;padding:3px 8px;border-radius:4px;font-family:inherit">'+v+'s</button>';}).join("")
   + '<button data-act="detenerTimer" style="background:transparent;border:none;color:var(--mute);font-size:18px;padding:0 4px">×</button></div></div>'

/* relee lo que está escrito en pantalla, por si algún evento se perdió */
function sincronizarDesdePantalla(){
  var cs=document.querySelectorAll("[data-card]");
  for(var i=0;i<cs.length;i++){
    var k=cs[i].getAttribute("data-card");
    if(k==="ritmoU") U.cardio.ritmoU=cs[i].value||"kmh";
    else U.cardio[k]=numTxt(cs[i].value);
  }
  var ss=document.querySelectorAll("[data-serie]");
  for(var j=0;j<ss.length;j++){
    var idx=+ss[j].getAttribute("data-serie"),campo=ss[j].getAttribute("data-campo");
    if(U.series[idx]) U.series[idx][campo]=numTxt(ss[j].value);
  }
}
function guardarSesion(){
  if(!U.activo){aviso("Elige un ejercicio primero",true);return;}
  sincronizarDesdePantalla();
  var ej=ejDe(U.activo),y=yaRegistrado();
  if(esCardio(ej)){
    if(U.cardio.min===""&&U.cardio.dist===""){aviso("Pon al menos duración o distancia",true);return;}
    var c={min:+U.cardio.min||0,dist:+U.cardio.dist||0,
           nivel:U.cardio.nivel===""?null:+U.cardio.nivel,
           fc:U.cardio.fc===""?null:+U.cardio.fc,
           ritmo:U.cardio.ritmo===""?null:+U.cardio.ritmo,
           ritmoU:U.cardio.ritmoU||"kmh"};
    if(y){y.cardio=c;delete y.sets;guardar();aviso(ej.nombre+" actualizado");return;}
    S.sesiones.push({id:uid(),ejercicioId:U.activo,fecha:U.fecha,cardio:c});
    guardar();aviso(ej.nombre+" guardado");return;
  }
  var limpias=U.series.filter(function(s){return s.w!==""&&s.r!=="";})
    .map(function(s){return {w:+s.w,r:+s.r,u:S.unidad};});
  if(!limpias.length){aviso("Escribe al menos una serie con peso y reps",true);return;}
  if(y){
    y.sets=limpias;delete y.cardio;guardar();
    aviso(esRecord(y)?"¡Récord nuevo en "+ej.nombre+"!":ej.nombre+" actualizado");
    iniciarTimer();return;
  }
  var ns={id:uid(),ejercicioId:U.activo,fecha:U.fecha,sets:limpias};
  S.sesiones.push(ns);guardar();
  aviso(esRecord(ns)?"¡Récord nuevo en "+ej.nombre+"!":ej.nombre+" guardado");
  iniciarTimer();
}
function moverSesionFecha(nuevaF){
  var y=yaRegistrado();
  if(!y){aviso("No hay registro que mover",true);return;}
  if(!nuevaF){aviso("Escoge una fecha",true);return;}
  if(nuevaF===y.fecha){U.moviendoFecha=false;render();return;}
  /* si ya hay un registro de ese ejercicio en la fecha destino, avisar */
  var choque=S.sesiones.filter(function(s){
    return s.ejercicioId===y.ejercicioId && s.fecha===nuevaF && s.id!==y.id;})[0];
  if(choque){
    aviso("Ya tienes un registro de este ejercicio ese día",true);
    return;
  }
  y.fecha=nuevaF;
  U.moviendoFecha=false; U.nuevaFecha="";
  U.fecha=nuevaF;
  cargarBorrador(); guardar();
  aviso("Registro movido al "+fmtFecha(nuevaF));
}
function borrarSesion(id){
  S.sesiones=S.sesiones.filter(function(s){return s.id!==id;});

}
function jornada(f){return S.jornadas[f]||null;}
function minJornada(f){
  var j=jornada(f); if(!j) return null;
  if(j.fin&&j.ini) return Math.max(1,Math.round((j.fin-j.ini)/60000));
  return null;
}
function iniciarJornada(){S.jornadas[U.fecha]={ini:Date.now(),fin:null};guardar();render();}
function terminarJornada(){
  var j=S.jornadas[U.fecha]; if(!j) return;
  j.fin=Date.now();guardar();aviso("Sesión de "+minJornada(U.fecha)+" min guardada");
}
function guardarPeso(){
  var v=parseFloat(U.pesoIn);

  S.peso=S.peso.filter(function(p){return p.fecha!==U.fecha;});

  document.body.appendChild(a);a.click();document.body.removeChild(a);

/* ===================== GRÁFICA ===================== */
function grafica(datos,clave,color,sufijo){
  if(!datos.length) return "";
  var W=520,H=190,ml=46,mr=10,mt=14,mb=26;
  var vals=datos.map(function(d){return d[clave];});
  var min=Math.min.apply(null,vals),max=Math.max.apply(null,vals);
  if(min===max){min=min-1;max=max+1;}
  var pad=(max-min)*0.12;min-=pad;max+=pad;if(min<0)min=0;
  var px=function(i){return datos.length===1?ml+(W-ml-mr)/2:ml+i*(W-ml-mr)/(datos.length-1);};
  var py=function(v){return mt+(H-mt-mb)*(1-(v-min)/(max-min));};
  var g="";
  for(var k=0;k<4;k++){
    var v=min+(max-min)*k/3,y=py(v);
    g+='<line x1="'+ml+'" y1="'+y+'" x2="'+(W-mr)+'" y2="'+y+'" stroke="#333C48" stroke-width="1"/>'
     + '<text x="'+(ml-6)+'" y="'+(y+4)+'" fill="#8B95A3" font-size="11" text-anchor="end">'
     + (sufijo==="ritmo"?fmtRitmo(v):nfmt(v))+'</text>';
  }
  var d="";
  datos.forEach(function(p,i){d+=(i?" L":"M")+px(i).toFixed(1)+" "+py(p[clave]).toFixed(1);});
  g+='<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linejoin="round"/>';
  datos.forEach(function(p,i){
    g+='<circle cx="'+px(i).toFixed(1)+'" cy="'+py(p[clave]).toFixed(1)+'" r="3.2" fill="'+color+'"/>';
    if(p.pr) g+='<circle cx="'+px(i).toFixed(1)+'" cy="'+py(p[clave]).toFixed(1)+'" r="6.5" fill="none" stroke="#E8C25A" stroke-width="2"/>';
  });
  var paso=Math.ceil(datos.length/6);
  datos.forEach(function(p,i){
    if(i%paso===0||i===datos.length-1)
      g+='<text x="'+px(i).toFixed(1)+'" y="'+(H-8)+'" fill="#8B95A3" font-size="11" text-anchor="middle">'+esc(p.f)+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">'+g+'</svg>';
}

function hCardio(c){

  if(c.min) p.push('<div><div class="p">'+n1(c.min)+' min</div><div class="e">duración</div></div>');
  if(c.dist) p.push('<div><div class="p">'+n1(c.dist)+' km</div><div class="e">distancia</div></div>');
  if(r!=null) p.push('<div><div class="p">'+fmtRitmo(r)+'</div><div class="e">min/km</div></div>');
  if(v!=null) p.push('<div><div class="p">'+n1(v)+' km/h</div><div class="e">velocidad</div></div>');
  if(c.ritmo!=null&&c.ritmo!==""){
    var uLab={kmh:"km/h",rpm:"RPM",spm:"SPM",w:"W"}[c.ritmoU||"kmh"];
    p.push('<div><div class="p">'+n1(c.ritmo)+' '+uLab+'</div><div class="e">máquina</div></div>');
  }
  if(c.nivel!=null&&c.nivel!=="") p.push('<div><div class="p">Niv '+c.nivel+'</div><div class="e">nivel</div></div>');
  if(c.fc!=null&&c.fc!=="") p.push('<div><div class="p">'+c.fc+' ppm</div><div class="e">pulso</div></div>');

        var dc=ss.filter(sesCardio).map(function(s){
          var r=ritmo(s.cardio);
          return {f:s.fecha.slice(5).replace("-","/"),min:+s.cardio.min||0,dist:+s.cardio.dist||0,
                  ritmo:r==null?0:r,fc:+s.cardio.fc||0};});
        if(dc.length){
          var conR=dc.filter(function(d){return d.ritmo;});
          var mejorR=conR.length?Math.min.apply(null,conR.map(function(d){return d.ritmo;})):null;
          var distT=dc.reduce(function(a,d){return a+d.dist;},0);
          var minT=dc.reduce(function(a,d){return a+d.min;},0);
          h+='<div class="stats" style="margin-top:16px">'
           + '<div class="stat"><b>'+(mejorR!=null?fmtRitmo(mejorR):"—")+'</b><span>Mejor ritmo</span></div>'
           + '<div class="stat"><b>'+n1(distT)+'</b><span>km totales</span></div>'
           + '<div class="stat"><b>'+nfmt(minT)+'</b><span>min totales</span></div>'
           + '<div class="stat"><b>'+dc.length+'</b><span>Sesiones</span></div></div>';
          if(dc.some(function(d){return d.dist;}))
            h+='<div class="label">Distancia por sesión (km)</div>'+grafica(dc,"dist","#E8724F");
          if(conR.length)
            h+='<div class="label" style="margin-top:22px">Ritmo min/km · más abajo es mejor</div>'
             + grafica(conR,"ritmo","#D8A430","ritmo");
          h+='<div class="label" style="margin-top:22px">Duración (min)</div>'+grafica(dc,"min","#3E7CB1");
          var conFC=dc.filter(function(d){return d.fc;});
          if(conFC.length)
            h+='<div class="label" style="margin-top:22px">Pulso promedio (ppm)</div>'+grafica(conFC,"fc","#D95B5B");
        }
      } else {
        var df=ss.filter(function(s){return !sesCardio(s);}).map(function(s){
          return {f:s.fecha.slice(5).replace("-","/"),peso:maxKg(s.sets),
                  vol:volumen(s.sets),rm:rm1(s.sets),pr:esRecord(s)};});
        if(df.length){
          var mx=Math.max.apply(null,df.map(function(d){return d.peso;}));
          var mrm=Math.max.apply(null,df.map(function(d){return d.rm;}));
          var vt=df.reduce(function(a,d){return a+d.vol;},0);
          var est2=estancado(U.ejGrafica);
          h+='<div class="stats" style="margin-top:16px">'
           + '<div class="stat"><b>'+n1(mx)+' kg</b><span>Peso máximo</span><span>'+n1(mx/KG_POR_LB)+' lb</span></div>'
           + '<div class="stat"><b>'+n1(mrm)+' kg</b><span>Mejor 1RM</span></div>'
           + '<div class="stat"><b>'+df.length+'</b><span>Sesiones</span></div>'
           + '<div class="stat"><b>'+nfmt(vt)+'</b><span>Volumen kg</span></div></div>';
          if(est2>=4) h+='<div class="cardAmbar" style="font-size:13px;color:var(--mute)">'
            + '<b style="color:var(--amber)">Estancamiento</b> · '+est2+' sesiones sin superar tu mejor 1RM</div>';
          h+='<div class="label">1RM estimado · el círculo dorado es un récord</div>'+grafica(df,"rm","#E8C25A")
           + '<div class="label" style="margin-top:22px">Peso máximo por sesión</div>'+grafica(df,"peso","#D8A430")
           + '<div class="label" style="margin-top:22px">Volumen por sesión (kg)</div>'+grafica(df,"vol","#3E7CB1");
        }
      }
    }
  }

  /* ---------------- RESUMEN ---------------- */
  if(U.vista==="resumen"){
    h+=hCalendario()+hSeriesSemana()+hPesoCorporal();
  }

  /* ---------------- PIE ---------------- */
  h+='<div class="pie"><div class="label">Respaldo</div><div class="fila">'
   + '<button class="btn gris" data-act="csv">Reporte CSV</button>'
   + '<button class="btn gris" data-act="json">Copia completa</button>'
   + '<button class="btn gris" data-act="restaurar">Restaurar</button></div>'
   + '<div style="font-size:12px;color:var(--mute);margin-top:10px;line-height:1.5">'
   + 'Todo se guarda en este teléfono. La copia completa sirve para pasar tus datos a otro celular</div></div>';

  if(U.lupa) h+='<div class="lupa" data-act="cerrarLupa"><img src="'+U.lupa+'" alt=""></div>';

  document.getElementById("app").innerHTML=h;
  var f1=document.getElementById("nuevoIn");
  if(f1){f1.focus(); try{f1.setSelectionRange(f1.value.length,f1.value.length);}catch(err){}}
  var f2=document.getElementById("etiquetaIn"); if(f2) f2.focus();
}

/* ---------- calendario ---------- */
function hCalendario(){
  var base=U.calMes?new Date(U.calMes+"-01T00:00:00"):new Date();
  var anio=base.getFullYear(),mes=base.getMonth();
  var ini=(new Date(anio,mes,1).getDay()+6)%7;
  var dm=new Date(anio,mes+1,0).getDate();
  var dias={};
  S.sesiones.forEach(function(s){
    var e=ejDe(s.ejercicioId)||{};
    (dias[s.fecha]=dias[s.fecha]||[]).push(colorGrupo(e.grupo));});
  var h='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">'
   + '<button class="link gris" data-cal="-1" style="font-size:20px;padding:0 10px">‹</button>'
   + '<b style="font-size:16px">'+MESES_L[mes]+" "+anio+'</b>'
   + '<button class="link gris" data-cal="1" style="font-size:20px;padding:0 10px">›</button></div>';
  h+='<div class="cal">'+["L","M","M","J","V","S","D"].map(function(d){return '<div class="dh">'+d+'</div>';}).join("");
  for(var i=0;i<ini;i++) h+='<div class="d fuera"></div>';
  var cuenta=0;
  for(var d2=1;d2<=dm;d2++){
    var iso=anio+"-"+String(mes+1).padStart(2,"0")+"-"+String(d2).padStart(2,"0");
    var act=!!dias[iso]; if(act) cuenta++;
    var cols=act?dias[iso].filter(function(v,j,a){return a.indexOf(v)===j;}).slice(0,3):[];
    var pasado=iso<=hoyISO();
    h+='<div class="d'+(act?" act":(pasado?" desc":""))+(iso===hoyISO()?" hoy":"")+'">'+d2
     + (cols.length?'<div style="display:flex;gap:2px;margin-top:2px">'
        + cols.map(function(c){return '<span style="width:4px;height:4px;border-radius:50%;background:'+c+';display:block"></span>';}).join("")
        + '</div>':"")+'</div>';
  }
  h+='</div>';
  /* resumen entrenados vs descanso */
  var hoyStr=hoyISO();
  var diasTranscurridos=0;
  for(var dd=1;dd<=dm;dd++){
    var isoD=anio+"-"+String(mes+1).padStart(2,"0")+"-"+String(dd).padStart(2,"0");
    if(isoD<=hoyStr) diasTranscurridos++;
  }
  var descanso=Math.max(0,diasTranscurridos-cuenta);
  h+='<div style="display:flex;gap:8px;margin:12px 0 26px">'
   + '<div class="stat" style="flex:1"><b style="color:var(--blue)">'+cuenta+'</b><span>días entrenados</span></div>'
   + '<div class="stat" style="flex:1"><b style="color:var(--mute)">'+descanso+'</b><span>días de descanso</span></div>'
   + '</div>';
  return h;
}

/* ---------- series por grupo, últimos 7 días ---------- */
function hSeriesSemana(){
  var lim=new Date();lim.setDate(lim.getDate()-6);
  var desde=lim.getFullYear()+"-"+String(lim.getMonth()+1).padStart(2,"0")+"-"+String(lim.getDate()).padStart(2,"0");
  var acum={},minCard=0;
  S.sesiones.forEach(function(s){
    if(s.fecha<desde) return;
    var e=ejDe(s.ejercicioId)||{};
    if(sesCardio(s)){minCard+=+s.cardio.min||0;return;}
    var g=e.grupo||"otro";
    acum[g]=(acum[g]||0)+(s.sets?s.sets.length:0);
  });
  var claves=Object.keys(acum);
  var h='<div style="font-size:15px;font-weight:700;margin-bottom:3px">Últimos 7 días</div>'
   + '<div class="label" style="margin-bottom:12px">Series por grupo muscular</div>';
  if(!claves.length&&!minCard) return h+'<div class="vacio" style="margin-bottom:26px">No has registrado nada esta semana</div>';
  var max=Math.max.apply(null,claves.map(function(k){return acum[k];}).concat([1]));
  GRUPOS.forEach(function(g){
    if(!acum[g.id]) return;
    var v=acum[g.id];
    h+='<div style="margin-bottom:10px">'
     + '<div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px">'
     + '<span>'+g.label+'</span><b style="font-variant-numeric:tabular-nums">'+v+' series</b></div>'
     + '<div class="barra"><i style="width:'+(v/max*100).toFixed(0)+'%;background:'+g.color+'"></i></div></div>';
  });
  if(minCard) h+='<div style="margin-bottom:10px">'
    + '<div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px">'
    + '<span>Cardio</span><b style="font-variant-numeric:tabular-nums">'+nfmt(minCard)+' min</b></div>'
    + '<div class="barra"><i style="width:100%;background:#E8724F"></i></div></div>';
  return h+'<div style="height:26px"></div>';
}

/* ---------- modo entreno ---------- */
function listaEntreno(){
  var ejsDia=S.ejercicios.filter(function(e){
    return U.diaSel===null?(!e.dias||e.dias.length===0):(e.dias&&e.dias.indexOf(U.diaSel)>=0);});
  if(U.diaSel===null) return ejsDia;
  var ord=S.ordenDias[U.diaSel]||[];
  var ordenados=ord.map(function(id){return ejsDia.filter(function(e){return e.id===id;})[0];}).filter(Boolean);
  var restantes=ejsDia.filter(function(e){return ord.indexOf(e.id)<0;});
  return ordenados.concat(restantes);
}

/* ===================== EVENTOS ===================== */
document.addEventListener("click",function(ev){
  var t=ev.target.closest("[data-tab],[data-dia],[data-ej],[data-act],[data-quitar],[data-uni],"
    +"[data-ir],[data-graf],[data-corregir],[data-borrarej],[data-lupa],[data-gf],[data-gn],"
    +"[data-tn],[data-cal],[data-ent],[data-diatog],[data-toggle],"
    +"[data-editnom],[data-renom],[data-tseg],[data-orddiasel],[data-subedia],[data-bajadia]");
  if(!t) return;
  var d=t.dataset;

  if(d.tab){U.vista=d.tab;U.busca="";return render();}
  if(d.lupa){U.lupa=S.fotos[d.lupa];return render();}
  if(d.dia!==undefined){U.diaSel=d.dia==="null"?null:+d.dia;U.activo=null;U.editEtiqueta=false;
    U.busca="";cargarBorrador();return render();}
  if(d.ej){U.activo=d.ej;U.moviendoFecha=false;cargarBorrador();return render();}
  if(d.graf){U.ejGrafica=d.graf;return render();}
  if(d.gf!==undefined){U.grupoFiltro=d.gf===""?null:d.gf;U.ejGrafica=null;return render();}
  if(d.gn!==undefined){U.grupoNuevo=d.gn;return render();}
  if(d.tn!==undefined){U.tipoNuevo=d.tn;return render();}
  if(d.cal!==undefined){
    var b=U.calMes?new Date(U.calMes+"-01T00:00:00"):new Date();
    b.setMonth(b.getMonth()+(+d.cal));
    U.calMes=b.getFullYear()+"-"+String(b.getMonth()+1).padStart(2,"0");
    return render();
  }
  if(d.ent!==undefined){U.entreno.i+=(+d.ent);cargarBorrador();return render();}
  if(d.ir){var e0=ejDe(d.ir);if(e0)U.diaSel=(e0.dia===undefined?null:e0.dia);
    U.activo=d.ir;U.busca="";cargarBorrador();return render();}
  if(d.corregir){
    var s0=S.sesiones.filter(function(x){return x.id===d.corregir;})[0];
    if(s0){U.vista="hoy";U.fecha=s0.fecha;U.activo=s0.ejercicioId;U.busca="";
      var e1=ejDe(s0.ejercicioId);if(e1)U.diaSel=(e1.dia===undefined?null:e1.dia);
      cargarBorrador();}
    return render();
  }
  if(d.toggle!==undefined){
    U.diasAbiertos[d.toggle]=U.diasAbiertos[d.toggle]===undefined
      ?(d.toggle!==hoyISO()):!U.diasAbiertos[d.toggle];
    return render();
  }
  if(d.borrarej) return borrarEjercicio(d.borrarej);
  if(d.editnom!==undefined){U.editandoNombre=d.editnom;return render();}
  if(d.renom!==undefined){
    var inp=document.getElementById("renomIn_"+d.renom)||document.getElementById("renomInH");
    if(inp) renombrarEjercicio(d.renom,inp.value);
    return;
  }
  if(d.diatog!==undefined){
    var parts=d.diatog.split(":"),eid=parts[0],di=+parts[1];
    var ej5=ejDe(eid); if(!ej5) return;
    if(!ej5.dias) ej5.dias=[];
    var idx5=ej5.dias.indexOf(di);
    if(idx5>=0){
      /* quitar del día */
      ej5.dias.splice(idx5,1);
      if(S.ordenDias[di]){
        var oi=S.ordenDias[di].indexOf(eid);
        if(oi>=0) S.ordenDias[di].splice(oi,1);
      }
    } else {
      /* agregar al día, al final del orden */
      ej5.dias.push(di);
      if(!S.ordenDias[di]) S.ordenDias[di]=[];
      if(S.ordenDias[di].indexOf(eid)<0) S.ordenDias[di].push(eid);
    }
    guardar(); return render();
  }
  if(d.orddiasel!==undefined){U.ordenDiaSel=+d.orddiasel;return render();}
  if(d.subedia!==undefined){
    var sp=d.subedia.split(":");
    return moverEnDia(sp[0],+sp[1],-1);
  }
  if(d.bajadia!==undefined){
    var bp=d.bajadia.split(":");
    return moverEnDia(bp[0],+bp[1],1);
  }
  if(d.tseg!==undefined){U.timerSeg=+d.tseg;if(U.timer!==null)U.timer=Math.min(U.timer,U.timerSeg);
    var z2=document.getElementById("timer");if(z2)z2.innerHTML=hTimer(); return;}
  if(d.quitar!==undefined){var i0=+d.quitar;
    U.series=U.series.length===1?[{w:"",r:""}]:U.series.filter(function(_,j){return j!==i0;});
    return render();}
  if(d.uni){S.unidad=d.uni;guardar();return render();}

  switch(d.act){
    case "nuevo": U.nuevo=!U.nuevo; if(!U.nuevo)U.nombreNuevo=""; return render();
    case "crear": return crearEjercicio((document.getElementById("nuevoIn")||{}).value);
    case "editEtiqueta": U.editEtiqueta=true; return render();
    case "guardarEtiqueta":
      S.etiquetas[U.diaSel]=((document.getElementById("etiquetaIn")||{}).value||"").trim();
      U.editEtiqueta=false;guardar();return render();
    case "foto": return document.getElementById("inFoto").click();
    case "quitarFoto": delete S.fotos[U.activo];guardar();return render();
    case "masSerie":
      var last=U.series[U.series.length-1]||{w:"",r:""};
      U.series.push({w:last.w,r:last.r});return render();
    case "guardar": return guardarSesion();
    case "borrarSesion": var yy=yaRegistrado();if(yy)borrarSesion(yy.id);return;
    case "moverFecha": U.moviendoFecha=true;U.nuevaFecha=U.fecha;return render();
    case "cancelarMover": U.moviendoFecha=false;U.nuevaFecha="";return render();
    case "confirmarMover":
      var mf=document.getElementById("moverFechaIn");
      return moverSesionFecha(mf?mf.value:"");
    case "iniciarJornada": return iniciarJornada();
    case "terminarJornada": return terminarJornada();
    case "reiniciarJornada": delete S.jornadas[U.fecha];guardar();return render();
    case "guardarPeso": return guardarPeso();
    case "entreno": U.entreno={i:0};cargarBorrador();return render();
    case "salirEntreno": U.entreno=null;return render();
    case "csv": return exportarCSV();
    case "json": return exportarJSON();
    case "volverProgreso": U.ejGrafica=null; return render();
    case "cancelarRenom": U.editandoNombre=null; return render();
    case "detenerTimer": return detenerTimer();
    case "restaurar": return document.getElementById("inJson").click();
    case "cerrarLupa": U.lupa=null;return render();
  }
});

document.addEventListener("input",function(ev){
  var t=ev.target;
  if(t.id==="moverFechaIn"){U.nuevaFecha=t.value;return;}
  if(t.id==="fechaIn"){U.fecha=t.value;U.moviendoFecha=false;cargarBorrador();return render();}
  if(t.id==="pesoIn"){U.pesoIn=numTxt(t.value);return;}
  if(t.id==="nuevoIn"){U.nombreNuevo=t.value;return;}
  if(t.id==="buscaIn"){
    U.busca=t.value;
    var c=document.getElementById("chipsEj");
    if(c) c.innerHTML=hChips();
    return;
  }
  if(t.dataset.nota!==undefined){
    var en=ejDe(t.dataset.nota);if(en){en.nota=t.value;guardar();}
    return;
  }
  if(t.dataset.card!==undefined){
    U.cardio[t.dataset.card]=numTxt(t.value);
    var dv=document.getElementById("derivado");if(dv)dv.textContent=textoDerivado();
    var z1=document.getElementById("zonaGuardar");if(z1)z1.innerHTML=zonaGuardar();
    return;
  }
  if(t.dataset.serie===undefined) return;
  var i=+t.dataset.serie;
  U.series[i][t.dataset.campo]=numTxt(t.value);
  if(t.dataset.campo==="w"){
    var cv=document.querySelector('[data-conv="'+i+'"]');
    if(cv) cv.textContent=t.value!==""?"= "+equiv(numTxt(t.value),S.unidad):"";
  }
  var dr=document.querySelector('[data-derivado]');
  if(dr) dr.textContent=texto1RM();
  var z=document.getElementById("zonaGuardar");if(z)z.innerHTML=zonaGuardar();
});

/* al salir de un campo, asegurar que el valor quedó guardado en el borrador */
document.addEventListener("blur",function(ev){
  var t=ev.target;
  if(t.dataset&&t.dataset.card!==undefined&&t.dataset.card!=="ritmoU"){
    U.cardio[t.dataset.card]=numTxt(t.value);
    var z=document.getElementById("zonaGuardar");if(z)z.innerHTML=zonaGuardar();
  }
  if(t.dataset&&t.dataset.serie!==undefined){
    var i=+t.dataset.serie;
    if(U.series[i]) U.series[i][t.dataset.campo]=numTxt(t.value);
    var z2=document.getElementById("zonaGuardar");if(z2)z2.innerHTML=zonaGuardar();
  }
},true);

document.addEventListener("change",function(ev){
  var ds=ev.target.dataset;
  if(ds.mover!==undefined){
    // legacy - ya no se usa pero se mantiene por compatibilidad
    return;
  }
  if(ds.grupo!==undefined){
    var e3=ejDe(ds.grupo);
    if(e3){
      e3.grupo=ev.target.value||"otro";
      if(e3.grupo==="cardio") e3.tipo="cardio";
      else if(e3.tipo==="cardio") e3.tipo="fuerza";
      cargarBorrador();guardar();render();
    }
    return;
  }
  if(ds.card!==undefined){
    U.cardio[ds.card]=ev.target.value;
    var dv0=document.getElementById("derivado");if(dv0)dv0.textContent=textoDerivado();
    var z0=document.getElementById("zonaGuardar");if(z0)z0.innerHTML=zonaGuardar();
    return;
  }
  if(ds.tipo!==undefined){
    var e4=ejDe(ds.tipo);
    if(e4){
      e4.tipo=ev.target.value;
      if(e4.tipo==="cardio") e4.grupo="cardio";
      else if(e4.grupo==="cardio") e4.grupo="otro";
      cargarBorrador();guardar();render();
    }
    return;
  }
});

document.addEventListener("keydown",function(ev){
  if(ev.key!=="Enter") return;
  if(ev.target.id==="nuevoIn") crearEjercicio(ev.target.value);
  if(ev.target.id==="etiquetaIn"){
    S.etiquetas[U.diaSel]=ev.target.value.trim();U.editEtiqueta=false;guardar();render();}
  if(ev.target.id==="pesoIn") guardarPeso();
  if(ev.target.id==="renomInH"){renombrarEjercicio(U.editandoNombre,ev.target.value);}
  if(ev.target.id&&ev.target.id.indexOf("renomIn_")===0){
    renombrarEjercicio(ev.target.id.replace("renomIn_",""),ev.target.value);}
});

/* ===================== ARRANQUE ===================== */
cargar();
cargarBorrador();
render();

if("serviceWorker" in navigator && location.protocol==="https:"){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script>
