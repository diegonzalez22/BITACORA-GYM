<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14171B">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="Bitácora">
<title>Bitácora de cargas</title>
<style>
  :root{
    --iron:#14171B; --surface:#1D222A; --surfaceHi:#262D37; --line:#333C48;
    --chalk:#ECE8E1; --mute:#8B95A3; --blue:#3E7CB1; --amber:#D8A430;
    --red:#B04A3C; --green:#8FD3A8; --greenBg:#1E2B25;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;background:var(--iron);color:var(--chalk);
    font-family:-apple-system,'Helvetica Neue',Helvetica,system-ui,sans-serif;
    padding-bottom:60px;
  }
  .wrap{max-width:560px;margin:0 auto;padding:20px 16px;
    padding-top:calc(20px + env(safe-area-inset-top))}
  h1{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1;margin:0}
  .sub{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:14px;color:var(--mute);flex-wrap:wrap}
  .estado{font-size:12px;font-weight:600}
  .ok{color:var(--green)} .err{color:#E39A8E}
  .tabs{display:flex;gap:4px;background:var(--surface);padding:4px;border-radius:8px;margin:20px 0}
  .tabs button{flex:1;background:transparent;color:var(--mute);border:none;border-radius:6px;
    padding:10px 0;font-size:14px;font-weight:600;font-family:inherit}
  .tabs button.on{background:var(--surfaceHi);color:var(--chalk)}
  .dias{display:flex;gap:4px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px}
  .dias button{flex:1 0 auto;min-width:46px;background:var(--surface);color:var(--mute);
    border:1px solid var(--line);border-radius:6px;padding:9px 6px;font-size:13px;
    font-weight:600;font-family:inherit}
  .dias button.tiene{color:var(--chalk)}
  .dias button.on{background:var(--blue);border-color:var(--blue);color:var(--chalk)}
  .chip{background:var(--surface);color:var(--chalk);border:1px solid var(--line);
    border-radius:20px;padding:8px 14px;font-size:14px;font-family:inherit;
    display:inline-flex;align-items:center;gap:8px}
  .chip.on{background:var(--blue);border-color:var(--blue)}
  .chip img{width:26px;height:26px;border-radius:13px;object-fit:cover}
  .chip.foto{padding-left:6px}
  .dash{background:transparent;color:var(--mute);border:1px dashed var(--line);
    border-radius:20px;padding:8px 14px;font-size:14px;font-family:inherit}
  .fila{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
  input,select{background:var(--iron);border:1px solid var(--line);color:var(--chalk);
    border-radius:6px;padding:10px 12px;font-size:16px;width:100%;outline:none;
    font-variant-numeric:tabular-nums;font-family:inherit}
  .btn{background:var(--blue);color:var(--chalk);border:none;border-radius:6px;
    padding:12px 16px;font-size:15px;font-weight:600;font-family:inherit;width:100%}
  .btn.gris{background:var(--surfaceHi)}
  .link{background:transparent;border:none;color:var(--blue);font-size:14px;
    font-weight:600;font-family:inherit;padding:6px 0}
  .link.rojo{color:var(--red);font-size:13px}
  .link.gris{color:var(--mute);font-size:13px}
  .vacio{border:1px dashed var(--line);border-radius:8px;padding:24px;text-align:center;
    color:var(--mute);font-size:14px}
  .label{font-size:13px;color:var(--mute);margin-bottom:8px}
  .card{background:var(--surface);border-radius:8px;padding:12px 14px;margin-bottom:8px}
  .cardVerde{background:var(--greenBg);border-left:3px solid #6BBF8A;border-radius:0 8px 8px 0;
    padding:12px 14px;margin-bottom:14px}
  .cardAmbar{background:var(--surface);border-left:3px solid var(--amber);
    border-radius:0 8px 8px 0;padding:12px 14px;margin-bottom:18px}
  .cardRoja{background:#3A2220;color:#E39A8E;padding:12px 14px;border-radius:6px;
    font-size:13px;margin-bottom:16px;line-height:1.5}
  .serieFila{display:flex;gap:8px;align-items:center}
  .num{width:22px;color:var(--mute);font-size:14px;font-variant-numeric:tabular-nums;flex:0 0 22px}
  .x{background:transparent;color:var(--mute);border:none;font-size:20px;padding:0 6px;font-family:inherit}
  .conv{margin-left:30px;margin-top:3px;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
  .sets{display:flex;flex-wrap:wrap;gap:10px 18px;font-variant-numeric:tabular-nums}
  .sets .p{font-size:15px}
  .sets .e{font-size:11px;color:var(--mute);margin-top:1px}
  .cab{display:flex;justify-content:space-between;align-items:baseline;
    padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:10px}
  .seg{display:flex;gap:2px;background:var(--surface);padding:2px;border-radius:6px}
  .seg button{background:transparent;color:var(--mute);border:none;border-radius:4px;
    padding:5px 14px;font-size:13px;font-weight:600;font-family:inherit}
  .seg button.on{background:var(--blue);color:var(--chalk)}
  .stats{display:flex;gap:10px;margin-bottom:20px}
  .stat{flex:1;background:var(--surface);border-radius:8px;padding:12px 10px}
  .stat b{font-size:20px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;display:block}
  .stat span{font-size:12px;color:var(--mute);display:block;margin-top:2px}
  .pie{margin-top:36px;padding-top:20px;border-top:1px solid var(--line)}
  .pie .fila{gap:8px}
  .pie .btn{flex:1;width:auto}
  .lupa{position:fixed;inset:0;background:rgba(10,12,14,.92);display:flex;
    align-items:center;justify-content:center;padding:20px;z-index:50}
  .lupa img{max-width:100%;max-height:100%;border-radius:10px}
  button{cursor:pointer}
  .oculto{display:none}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<input type="file" id="inFoto" accept="image/*" capture="environment" class="oculto">
<input type="file" id="inJson" accept="application/json,.json" class="oculto">

<script>
/* ========== constantes ========== */
var LLAVE="bitacora-gym-v1";
var KG_POR_LB=0.45359237;
var DIAS=[
 {i:0,c:"Lun",l:"Lunes"},{i:1,c:"Mar",l:"Martes"},{i:2,c:"Mié",l:"Miércoles"},
 {i:3,c:"Jue",l:"Jueves"},{i:4,c:"Vie",l:"Viernes"},{i:5,c:"Sáb",l:"Sábado"},
 {i:6,c:"Dom",l:"Domingo"}];
var MESES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];

/* ========== utilidades ========== */
function hoyISO(){
  var d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function diaDeISO(iso){ return (new Date(iso+"T00:00:00").getDay()+6)%7; }
function fmtFecha(iso){ var p=iso.split("-"); return p[2]+" "+MESES[+p[1]-1]+" "+p[0]; }
function uid(){ return Math.random().toString(36).slice(2,10); }
function uni(s){ return s.u||"kg"; }
function enKg(s){ return uni(s)==="lb" ? (+s.w||0)*KG_POR_LB : (+s.w||0); }
function equiv(v,u){
  var n=parseFloat(v); if(isNaN(n)) return "";
  return u==="lb" ? (n*KG_POR_LB).toFixed(1)+" kg" : (n/KG_POR_LB).toFixed(1)+" lb";
}
function volumen(sets){ return sets.reduce(function(a,s){return a+enKg(s)*(+s.r||0);},0); }
function maxKg(sets){ return sets.reduce(function(a,s){return Math.max(a,enKg(s));},0); }
function nfmt(n){ return Math.round(n).toLocaleString("es-MX"); }
function esc(t){ return String(t==null?"":t).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

/* ========== estado ========== */
var S={ejercicios:[],sesiones:[],etiquetas:{},unidad:"kg",fotos:{}};
var U={vista:"registrar",diaSel:diaDeISO(hoyISO()),activo:null,fecha:hoyISO(),
       series:[{w:"",r:""}],nuevo:false,editEtiqueta:false,ejGrafica:null,grupoFiltro:null,
       lupa:null,aviso:null,estado:"ok",detalle:""};

/* ========== persistencia ========== */
function guardar(){
  try{
    localStorage.setItem(LLAVE,JSON.stringify(S));
    var v=localStorage.getItem(LLAVE);
    if(!v){ U.estado="error"; U.detalle="el navegador no devolvió lo guardado"; }
    else { U.estado="ok"; U.detalle=""; }
  }catch(e){
    U.estado="error";
    U.detalle=(e&&e.name||"Error")+": "+(e&&e.message||e);
  }
}
function cargar(){
  try{
    var v=localStorage.getItem(LLAVE);
    if(v){
      var d=JSON.parse(v);
      S.ejercicios=(d.ejercicios||[]).map(function(e){
        return {id:e.id,nombre:e.nombre,dia:(e.dia===undefined?null:e.dia)}; });
      S.sesiones=d.sesiones||[];
      S.etiquetas=d.etiquetas||{};
      S.unidad=d.unidad||"kg";
      S.fotos=d.fotos||{};
    }
    U.estado="ok";
  }catch(e){
    U.estado="error";
    U.detalle="No se pudo leer lo guardado: "+(e&&e.message||e);
  }
}
function aviso(msg,error){
  U.aviso={m:msg,e:!!error};
  render();
  setTimeout(function(){ U.aviso=null; render(); },3000);
}

/* ========== derivados ========== */
function nombreDe(id){
  var e=S.ejercicios.filter(function(x){return x.id===id;})[0];
  return e?e.nombre:"Ejercicio borrado";
}
function delDia(){
  return S.ejercicios.filter(function(e){
    return U.diaSel===null ? (e.dia===null||e.dia===undefined) : e.dia===U.diaSel; });
}
function sinDia(){
  return S.ejercicios.filter(function(e){return e.dia===null||e.dia===undefined;});
}
function yaRegistrado(){
  if(!U.activo) return null;
  return S.sesiones.filter(function(s){
    return s.ejercicioId===U.activo && s.fecha===U.fecha; })[0]||null;
}
function ultimaDe(id){
  return S.sesiones
    .filter(function(s){return s.ejercicioId===id && s.fecha!==U.fecha;})
    .sort(function(a,b){return a.fecha<b.fecha?1:-1;})[0]||null;
}
function porFecha(){
  var m={};
  S.sesiones.forEach(function(s){ (m[s.fecha]=m[s.fecha]||[]).push(s); });
  return Object.keys(m).sort(function(a,b){return a<b?1:-1;}).map(function(f){return [f,m[f]];});
}
function sinGuardar(){
  var y=yaRegistrado();
  var a=U.series.filter(function(s){return s.w!==""&&s.r!=="";})
    .map(function(s){return (+s.w)+"|"+(+s.r)+"|"+S.unidad;}).join(",");
  var b=y?y.sets.map(function(x){return (+x.w)+"|"+(+x.r)+"|"+uni(x);}).join(","):"";
  return a!==b;
}
function cargarBorrador(){
  var y=yaRegistrado();
  if(y){
    U.series=y.sets.map(function(x){return {w:String(x.w),r:String(x.r)};});
    S.unidad=uni(y.sets[0]);
  } else {
    U.series=[{w:"",r:""}];
  }
}

/* ========== acciones ========== */
function crearEjercicio(nombre){
  nombre=(nombre||"").trim();
  if(!nombre) return;
  var grupo=U.grupoNuevo||"otro";
  var e={id:uid(),nombre:nombre,dia:U.diaSel,grupo:grupo};
  S.ejercicios.push(e);
  U.activo=e.id; U.nuevo=false; U.grupoNuevo=null;
  cargarBorrador(); guardar(); render();
}
function borrarEjercicio(id){
  S.ejercicios=S.ejercicios.filter(function(e){return e.id!==id;});
  S.sesiones=S.sesiones.filter(function(s){return s.ejercicioId!==id;});
  delete S.fotos[id];
  if(U.activo===id) U.activo=null;
  if(U.ejGrafica===id) U.ejGrafica=null;
  guardar(); render();
}
function guardarSesion(){
  if(!U.activo){ aviso("Elige un ejercicio primero",true); return; }
  var limpias=U.series.filter(function(s){return s.w!==""&&s.r!=="";})
    .map(function(s){return {w:+s.w,r:+s.r,u:S.unidad};});
  if(!limpias.length){ aviso("Escribe al menos una serie con peso y reps",true); return; }
  var y=yaRegistrado();
  if(y){ y.sets=limpias; guardar(); aviso(nombreDe(U.activo)+" actualizado"); return; }
  S.sesiones.push({id:uid(),ejercicioId:U.activo,fecha:U.fecha,sets:limpias});
  guardar(); aviso(nombreDe(U.activo)+" guardado");
}
function borrarSesion(id){
  S.sesiones=S.sesiones.filter(function(s){return s.id!==id;});
  cargarBorrador(); guardar(); render();
}

/* ========== fotos ========== */
document.getElementById("inFoto").addEventListener("change",function(ev){
  var f=ev.target.files&&ev.target.files[0];
  ev.target.value="";
  if(!f||!U.activo) return;
  var destino=U.activo;
  var fr=new FileReader();
  fr.onload=function(){
    var img=new Image();
    img.onload=function(){
      var lado=280, k=Math.min(lado/img.width,lado/img.height,1);
      var c=document.createElement("canvas");
      c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      S.fotos[destino]=c.toDataURL("image/jpeg",0.6);
      guardar();
      if(U.estado==="error") aviso("No hubo espacio para la foto",true);
      else aviso("Foto agregada");
    };
    img.onerror=function(){ aviso("No se pudo leer esa imagen",true); };
    img.src=fr.result;
  };
  fr.readAsDataURL(f);
});

/* ========== respaldo ========== */
function bajar(txt,nombre,tipo){
  var b=new Blob([txt],{type:tipo});
  var url=URL.createObjectURL(b);
  var a=document.createElement("a");
  a.href=url; a.download=nombre;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url);},1000);
}
function exportarCSV(){
  if(!S.sesiones.length){ aviso("Todavía no hay entrenamientos que exportar",true); return; }
  var f=[["Fecha","Dia","Rutina","Ejercicio","Serie","Peso","Unidad","Peso_kg","Peso_lb","Reps","Volumen_kg"]];
  porFecha().forEach(function(par){
    var d=diaDeISO(par[0]);
    par[1].forEach(function(s){
      s.sets.forEach(function(set,i){
        var kg=enKg(set);
        f.push([par[0],DIAS[d].l,S.etiquetas[d]||"",nombreDe(s.ejercicioId),i+1,
          set.w,uni(set),kg.toFixed(2),(kg/KG_POR_LB).toFixed(2),set.r,(kg*set.r).toFixed(2)]);
      });
    });
  });
  bajar("\uFEFF"+f.map(function(r){return r.join(",");}).join("\n"),
    "gym-reporte-"+hoyISO()+".csv","text/csv");
  aviso("Reporte descargado");
}
function exportarJSON(){
  bajar(JSON.stringify(S,null,2),"gym-respaldo-"+hoyISO()+".json","application/json");
  aviso("Copia descargada");
}
document.getElementById("inJson").addEventListener("change",function(ev){
  var f=ev.target.files&&ev.target.files[0];
  ev.target.value="";
  if(!f) return;
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var d=JSON.parse(fr.result);
      if(!Array.isArray(d.ejercicios)||!Array.isArray(d.sesiones)) throw new Error();
      S.ejercicios=d.ejercicios.map(function(e){
        return {id:e.id,nombre:e.nombre,dia:(e.dia===undefined?null:e.dia)}; });
      S.sesiones=d.sesiones; S.etiquetas=d.etiquetas||{};
      S.unidad=d.unidad||"kg"; S.fotos=d.fotos||{};
      U.activo=null; cargarBorrador(); guardar();
      aviso("Copia restaurada");
    }catch(e){ aviso("Ese archivo no es una copia válida",true); }
  };
  fr.readAsText(f);
});

/* ========== gráfica svg propia ========== */
var GRUPOS=[
  {id:"pierna",   label:"Pierna",          color:"#5B8DD9"},
  {id:"pecho",    label:"Pecho",           color:"#D95B5B"},
  {id:"espalda",  label:"Espalda",         color:"#5BD98A"},
  {id:"hombro",   label:"Hombro",          color:"#D9A45B"},
  {id:"biceps",   label:"Bíceps / Tríceps",color:"#A45BD9"},
  {id:"core",     label:"Core / Abdomen",  color:"#5BD9D9"},
  {id:"otro",     label:"Otro",            color:"#8B95A3"},
];
function labelGrupo(id){ var g=GRUPOS.filter(function(x){return x.id===id;})[0]; return g?g.label:"Sin grupo"; }
function colorGrupo(id){ var g=GRUPOS.filter(function(x){return x.id===id;})[0]; return g?g.color:"#8B95A3"; }
function grafica(datos,clave,color){
  if(datos.length===0) return "";
  var W=520,H=200,ml=44,mr=10,mt=14,mb=26;
  var vals=datos.map(function(d){return d[clave];});
  var min=Math.min.apply(null,vals), max=Math.max.apply(null,vals);
  if(min===max){ min=min-1; max=max+1; }
  var pad=(max-min)*0.12; min-=pad; max+=pad;
  if(min<0) min=0;
  var px=function(i){ return datos.length===1 ? ml+(W-ml-mr)/2
      : ml+i*(W-ml-mr)/(datos.length-1); };
  var py=function(v){ return mt+(H-mt-mb)*(1-(v-min)/(max-min)); };
  var g="";
  for(var k=0;k<4;k++){
    var v=min+(max-min)*k/3, y=py(v);
    g+='<line x1="'+ml+'" y1="'+y+'" x2="'+(W-mr)+'" y2="'+y+'" stroke="#333C48" stroke-width="1"/>'
     + '<text x="'+(ml-6)+'" y="'+(y+4)+'" fill="#8B95A3" font-size="11" text-anchor="end">'+nfmt(v)+'</text>';
  }
  var d="";
  datos.forEach(function(p,i){ d+=(i?" L":"M")+px(i).toFixed(1)+" "+py(p[clave]).toFixed(1); });
  g+='<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linejoin="round"/>';
  datos.forEach(function(p,i){
    g+='<circle cx="'+px(i).toFixed(1)+'" cy="'+py(p[clave]).toFixed(1)+'" r="3" fill="'+color+'"/>';
  });
  var paso=Math.ceil(datos.length/6);
  datos.forEach(function(p,i){
    if(i%paso===0||i===datos.length-1)
      g+='<text x="'+px(i).toFixed(1)+'" y="'+(H-8)+'" fill="#8B95A3" font-size="11" text-anchor="middle">'+esc(p.f)+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">'+g+'</svg>';
}

/* ========== render ========== */
function hSets(sets){
  return '<div class="sets">'+sets.map(function(x){
    return '<div><div class="p">'+esc(x.w)+" "+uni(x)+" × "+esc(x.r)+'</div>'
         + '<div class="e">'+equiv(x.w,uni(x))+'</div></div>';
  }).join("")+'</div>';
}

function zonaGuardar(){
  var y=yaRegistrado(), h="";
  if(y && !sinGuardar()){
    h+='<div style="border:1px solid #33503F;color:var(--green);border-radius:6px;padding:12px;'
     + 'text-align:center;font-size:15px;font-weight:600;margin-top:10px">✓ Todo guardado</div>';
  } else {
    h+='<button class="btn" data-act="guardar" style="margin-top:10px">'
     + (y?"Actualizar registro":"Guardar ejercicio")+'</button>';
  }
  h+= y
    ? '<button class="link rojo" data-act="borrarSesion" style="width:100%;margin-top:10px">Borrar este registro</button>'
    : '<div style="font-size:12px;color:var(--mute);margin-top:10px;text-align:center">Guarda uno y sigue con el siguiente del día</div>';
  return h;
}

function render(){
  var h="";
  var y=yaRegistrado();

  /* encabezado */
  h+='<h1>Bitácora de cargas</h1><div class="sub">'
   + '<span>'+porFecha().length+" días entrenados · "+S.ejercicios.length+' ejercicios</span>'
   + '<span class="estado '+(U.estado==="ok"?"ok":"err")+'">'
   + (U.estado==="ok"?"✓ guardado":"⚠ no se guardó")+'</span></div>';

  h+='<div class="tabs">'
   + ['registrar','historial','progreso'].map(function(v){
       return '<button data-tab="'+v+'" class="'+(U.vista===v?"on":"")+'">'
         + v.charAt(0).toUpperCase()+v.slice(1)+'</button>'; }).join("")
   + '</div>';

  if(U.estado==="error"){
    h+='<div class="cardRoja">El guardado en este teléfono está fallando. Usa '
     + '<b>Copia completa</b> abajo antes de cerrar'
     + (U.detalle?'<div style="margin-top:8px;font-size:11px;font-family:monospace;color:var(--mute);word-break:break-all">'+esc(U.detalle)+'</div>':"")
     + '</div>';
  }
  if(U.aviso){
    h+='<div style="background:'+(U.aviso.e?"#3A2220":"var(--greenBg)")+';color:'
     + (U.aviso.e?"#E39A8E":"var(--green)")+';padding:10px 12px;border-radius:6px;font-size:14px;margin-bottom:16px">'
     + esc(U.aviso.m)+'</div>';
  }

  /* ---------- REGISTRAR ---------- */
  if(U.vista==="registrar"){
    h+='<div class="dias">'+DIAS.map(function(d){
      var tiene=S.ejercicios.some(function(e){return e.dia===d.i;});
      return '<button data-dia="'+d.i+'" class="'+(U.diaSel===d.i?"on":(tiene?"tiene":""))+'">'+d.c+'</button>';
    }).join("")
    + (sinDia().length?'<button data-dia="null" class="'+(U.diaSel===null?"on":"tiene")+'">Otros</button>':"")
    + '</div>';

    if(U.diaSel!==null){
      if(U.editEtiqueta){
        h+='<div class="fila" style="flex-wrap:nowrap">'
         + '<input id="etiquetaIn" value="'+esc(S.etiquetas[U.diaSel]||"")+'" placeholder="Pierna, Pecho y tríceps…">'
         + '<button class="btn" style="width:auto" data-act="guardarEtiqueta">Listo</button></div>';
      } else {
        h+='<div style="margin-bottom:18px"><button data-act="editEtiqueta" '
         + 'style="background:none;border:none;padding:0;text-align:left;color:var(--chalk);font-family:inherit">'
         + '<span style="font-size:22px;font-weight:700;letter-spacing:-.02em">'+DIAS[U.diaSel].l+'</span>'
         + '<span style="color:var(--mute);font-size:16px;margin-left:8px">'
         + esc(S.etiquetas[U.diaSel]||"poner nombre")+'</span></button></div>';
      }
    }

    h+='<div class="label">Ejercicio o máquina</div><div class="fila">';
    delDia().forEach(function(e){
      var col=colorGrupo(e.grupo);
      h+='<button class="chip '+(U.activo===e.id?"on":"")+(S.fotos[e.id]?" foto":"")+'" data-ej="'+e.id+'">'
       + (S.fotos[e.id]?'<img src="'+S.fotos[e.id]+'" alt="">':
         '<span style="width:8px;height:8px;border-radius:50%;background:'+col+';flex:0 0 8px;display:inline-block;margin-right:4px"></span>')
       + esc(e.nombre)+'</button>';
    });
    h+='<button class="dash" data-act="nuevo">+ Nuevo</button></div>';

    if(U.nuevo){
      var gn=U.grupoNuevo||"otro";
      h+='<div style="margin-bottom:8px">'
       + '<div class="label" style="margin-bottom:6px">Grupo muscular</div>'
       + '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px">'
       + GRUPOS.map(function(g){
           return '<button data-gn="'+g.id+'" style="background:'+(gn===g.id?g.color:"var(--surface)")+
             ';color:'+(gn===g.id?"#14171B":"var(--chalk)")+';border:1px solid '+(gn===g.id?g.color:"var(--line)")+
             ';border-radius:16px;padding:6px 12px;font-size:13px;font-weight:600;font-family:inherit">'+g.label+'</button>';
         }).join("")
       + '</div>'
       + '<div class="fila" style="flex-wrap:nowrap">'
       + '<input id="nuevoIn" placeholder="Press banca, Prensa de pierna…">'
       + '<button class="btn" style="width:auto" data-act="crear">Crear</button></div></div>';
    }

    if(!delDia().length && !U.nuevo){
      h+='<div class="vacio">'+(U.diaSel===null
        ?"Aquí quedan los ejercicios sin día asignado"
        :"Todavía no hay ejercicios para el "+DIAS[U.diaSel].l.toLowerCase())+'</div>';
    }

    if(U.activo){
      /* foto */
      h+='<div style="display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:8px;padding:10px;margin:18px 0">';
      h+= S.fotos[U.activo]
        ? '<img data-lupa="'+U.activo+'" src="'+S.fotos[U.activo]+'" style="width:64px;height:64px;border-radius:8px;object-fit:cover">'
        : '<div style="width:64px;height:64px;border-radius:8px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:22px">+</div>';
      h+='<div style="flex:1"><div style="font-size:15px;font-weight:700;margin-bottom:4px">'+esc(nombreDe(U.activo))+'</div>'
       + '<div style="display:flex;gap:12px"><button class="link" data-act="foto">'
       + (S.fotos[U.activo]?"Cambiar foto":"Agregar foto")+'</button>'
       + (S.fotos[U.activo]?'<button class="link gris" data-act="quitarFoto">Quitar</button>':"")
       + '</div></div></div>';

      if(y){
        h+='<div class="cardVerde"><div style="font-size:12px;color:var(--green);font-weight:600;'
         + 'letter-spacing:.04em;text-transform:uppercase;margin-bottom:8px">✓ Registrado · '+fmtFecha(U.fecha)+'</div>'
         + hSets(y.sets)
         + '<div style="font-size:12px;color:var(--mute);margin-top:8px">'+y.sets.length
         + " series · "+nfmt(volumen(y.sets))+' kg de volumen</div></div>';
      }

      var ult=ultimaDe(U.activo);
      if(ult){
        h+='<div class="cardAmbar"><div style="font-size:13px;color:var(--mute);margin-bottom:6px">'
         + "La vez pasada · "+fmtFecha(ult.fecha)+'</div>'+hSets(ult.sets)+'</div>';
      }

      h+='<div class="label">Fecha</div>'
       + '<input type="date" id="fechaIn" value="'+U.fecha+'" style="margin-bottom:18px">';

      h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">'
       + '<div class="label" style="margin:0">Series</div><div class="seg">'
       + ["kg","lb"].map(function(u){
           return '<button data-uni="'+u+'" class="'+(S.unidad===u?"on":"")+'">'+u+'</button>'; }).join("")
       + '</div></div>';

      h+='<div class="serieFila" style="margin-bottom:6px">'
       + '<div class="num"></div>'
       + '<div style="flex:1;font-size:12px;color:var(--mute)">Peso</div>'
       + '<div style="flex:1;font-size:12px;color:var(--mute)">Reps</div>'
       + '<div style="width:32px"></div></div>';

      U.series.forEach(function(s,i){
        h+='<div style="margin-bottom:8px"><div class="serieFila">'
         + '<div class="num">'+(i+1)+'</div>'
         + '<input type="number" inputmode="decimal" placeholder="'+S.unidad+'" data-serie="'+i+'" data-campo="w" value="'+esc(s.w)+'">'
         + '<input type="number" inputmode="numeric" placeholder="reps" data-serie="'+i+'" data-campo="r" value="'+esc(s.r)+'">'
         + '<button class="x" data-quitar="'+i+'">×</button></div>'
         + '<div class="conv" id="conv'+i+'">'+(s.w!==""?"= "+equiv(s.w,S.unidad):"")+'</div></div>';
      });

      h+='<button class="link" data-act="masSerie">+ Otra serie</button>';

      h+='<div id="zonaGuardar">'+zonaGuardar()+'</div>';
    }

    var delDiaFecha=S.sesiones.filter(function(s){return s.fecha===U.fecha;});
    if(delDiaFecha.length){
      h+='<div style="margin-top:28px"><div class="label" style="padding-bottom:8px;border-bottom:1px solid var(--line)">'
       + "Lo que llevas el "+fmtFecha(U.fecha)+'</div>';
      delDiaFecha.forEach(function(s){
        h+='<button class="card" data-ir="'+s.ejercicioId+'" style="display:block;width:100%;text-align:left;border:none;color:var(--chalk);font-family:inherit">'
         + '<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">'
         + (S.fotos[s.ejercicioId]?'<img src="'+S.fotos[s.ejercicioId]+'" style="width:22px;height:22px;border-radius:5px;object-fit:cover">':"")
         + '<span style="font-size:14px;font-weight:700">'+esc(nombreDe(s.ejercicioId))+'</span>'
         + '<span style="color:var(--green);font-size:13px">✓</span></div>'
         + '<div style="font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums">'
         + s.sets.map(function(x){return esc(x.w)+" "+uni(x)+" × "+esc(x.r);}).join("   ·   ")
         + '</div></button>';
      });
      h+='</div>';
    }
  }

  /* ---------- HISTORIAL ---------- */
  if(U.vista==="historial"){
    var pf=porFecha();
    if(!pf.length) h+='<div class="vacio">Aquí van a aparecer tus entrenamientos agrupados por día</div>';
    pf.forEach(function(par){
      var f=par[0], lista=par[1], d=diaDeISO(f);
      var vol=lista.reduce(function(a,s){return a+volumen(s.sets);},0);
      h+='<div style="margin-bottom:22px"><div class="cab"><div>'
       + '<span style="font-size:18px;font-weight:700">'+DIAS[d].l+'</span>'
       + '<span style="color:var(--mute);font-size:14px;margin-left:8px">'+fmtFecha(f)+'</span>'
       + (S.etiquetas[d]?'<span style="color:var(--amber);font-size:14px;margin-left:8px">'+esc(S.etiquetas[d])+'</span>':"")
       + '</div><div style="color:var(--mute);font-size:13px">'+nfmt(vol)+' kg</div></div>';
      lista.forEach(function(s){
        h+='<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">'
         + '<div style="display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px">'
         + (S.fotos[s.ejercicioId]?'<img data-lupa="'+s.ejercicioId+'" src="'+S.fotos[s.ejercicioId]+'" style="width:28px;height:28px;border-radius:6px;object-fit:cover">':"")
         + esc(nombreDe(s.ejercicioId))+'</div>'
         + '<button class="link" data-corregir="'+s.id+'">Corregir</button></div>'
         + hSets(s.sets)+'</div>';
      });
      h+='</div>';
    });

    if(S.ejercicios.length){
      h+='<div style="margin-top:28px"><div class="label">Mover ejercicios de día</div>';
      S.ejercicios.forEach(function(e){
        var cg=colorGrupo(e.grupo);
        h+='<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px">'
         + '<span style="width:8px;height:8px;border-radius:50%;background:'+cg+';flex:0 0 8px;display:inline-block"></span>'
         + '<span style="flex:1">'+esc(e.nombre)+'</span>'
         + '<select data-grupo="'+e.id+'" style="width:auto;font-size:12px"><option value="">Grupo</option>'
         + GRUPOS.map(function(g){return '<option value="'+g.id+'"'+((e.grupo||"otro")===g.id?" selected":"")+'>'+g.label+'</option>';}).join("")
         + '</select>'
         + '<select data-mover="'+e.id+'" style="width:auto"><option value=""'+((e.dia===null||e.dia===undefined)?" selected":"")+'>Sin día</option>'
         + DIAS.map(function(d){return '<option value="'+d.i+'"'+(e.dia===d.i?" selected":"")+'>'+d.c+'</option>';}).join("")
         + '</select>'
         + '<button class="link rojo" data-borrarEj="'+e.id+'">Eliminar</button></div>';
      });
      h+='</div>';
    }
  }

  /* ---------- PROGRESO ---------- */
  if(U.vista==="progreso"){
    /* filtro por grupo */
    var gruposConEj=GRUPOS.filter(function(g){
      return S.ejercicios.some(function(e){return (e.grupo||"otro")===g.id;});
    });
    if(gruposConEj.length>1){
      h+='<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px">';
      h+='<button data-gf="" style="background:'+(U.grupoFiltro===null?"var(--surfaceHi)":"var(--surface)")+
        ';color:var(--chalk);border:1px solid var(--line);border-radius:16px;padding:6px 12px;font-size:13px;font-weight:600;font-family:inherit">Todos</button>';
      gruposConEj.forEach(function(g){
        var on=U.grupoFiltro===g.id;
        h+='<button data-gf="'+g.id+'" style="background:'+(on?g.color:"var(--surface)")+
          ';color:'+(on?"#14171B":"var(--chalk)")+';border:1px solid '+(on?g.color:"var(--line)")+
          ';border-radius:16px;padding:6px 12px;font-size:13px;font-weight:600;font-family:inherit">'+g.label+'</button>';
      });
      h+='</div>';
    }
    var ejFiltrados=S.ejercicios.filter(function(e){
      return U.grupoFiltro===null || (e.grupo||"otro")===U.grupoFiltro;
    });
    if(!S.ejercicios.length){
      h+='<div class="vacio">Registra tu primer entrenamiento para ver el progreso</div>';
    } else if(!ejFiltrados.length){
      h+='<div class="vacio">No hay ejercicios en ese grupo todavía</div>';
    } else {
      /* agrupar los ejercicios filtrados */
      var porGrupo={};
      ejFiltrados.forEach(function(e){
        var g=e.grupo||"otro";
        (porGrupo[g]=porGrupo[g]||[]).push(e);
      });
      Object.keys(porGrupo).forEach(function(gid){
        var g=GRUPOS.filter(function(x){return x.id===gid;})[0]||{label:"Otro",color:"#8B95A3"};
        if(Object.keys(porGrupo).length>1){
          h+='<div style="font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;'
           + 'color:'+g.color+';margin-bottom:8px;margin-top:4px">'+g.label+'</div>';
        }
        h+='<div class="fila">';
        porGrupo[gid].forEach(function(e){
          h+='<button class="chip '+(U.ejGrafica===e.id?"on":"")+'" data-graf="'+e.id+'">'
           + '<span style="width:8px;height:8px;border-radius:50%;background:'+g.color+';display:inline-block;margin-right:4px"></span>'
           + esc(e.nombre)+'</button>';
        });
        h+='</div>';
      });
    }

    if(U.ejGrafica){
      var datos=S.sesiones.filter(function(s){return s.ejercicioId===U.ejGrafica;})
        .sort(function(a,b){return a.fecha>b.fecha?1:-1;})
        .map(function(s){return {f:s.fecha.slice(5).replace("-","/"),peso:maxKg(s.sets),vol:volumen(s.sets)};});
      if(!datos.length){
        h+='<div style="color:var(--mute);font-size:14px">Todavía no hay registros de este ejercicio</div>';
      } else {
        var mx=Math.max.apply(null,datos.map(function(d){return d.peso;}));
        var vt=datos.reduce(function(a,d){return a+d.vol;},0);
        h+='<div class="stats">'
         + '<div class="stat"><b>'+mx.toFixed(1)+' kg</b><span>Máximo</span><span>'+(mx/KG_POR_LB).toFixed(1)+' lb</span></div>'
         + '<div class="stat"><b>'+datos.length+'</b><span>Sesiones</span></div>'
         + '<div class="stat"><b>'+nfmt(vt)+'</b><span>Volumen total</span><span>kg movidos</span></div></div>'
         + '<div class="label">Peso máximo por sesión</div>'+grafica(datos,"peso","#D8A430")
         + '<div class="label" style="margin-top:24px">Volumen por sesión</div>'+grafica(datos,"vol","#3E7CB1");
      }
    }
  }

  /* ---------- pie ---------- */
  h+='<div class="pie"><div class="label">Respaldo</div><div class="fila">'
   + '<button class="btn gris" data-act="csv">Reporte CSV</button>'
   + '<button class="btn gris" data-act="json">Copia completa</button>'
   + '<button class="btn gris" data-act="restaurar">Restaurar</button></div>'
   + '<div style="font-size:12px;color:var(--mute);margin-top:10px;line-height:1.5">'
   + 'Todo se guarda en este teléfono. La copia completa sirve para pasar tus datos a otro celular</div></div>';

  if(U.lupa) h+='<div class="lupa" data-act="cerrarLupa"><img src="'+U.lupa+'" alt=""></div>';

  document.getElementById("app").innerHTML=h;

  var ni=document.getElementById("nuevoIn"); if(ni) ni.focus();
  var ei=document.getElementById("etiquetaIn"); if(ei) ei.focus();
}

/* ========== eventos ========== */
document.addEventListener("click",function(ev){
  var t=ev.target.closest("[data-tab],[data-dia],[data-ej],[data-act],[data-quitar],[data-uni],[data-ir],[data-graf],[data-corregir],[data-borrarEj],[data-lupa],[data-gf],[data-gn]");
  if(!t) return;
  var d=t.dataset;

  if(d.tab){ U.vista=d.tab; return render(); }
  if(d.lupa){ U.lupa=S.fotos[d.lupa]; return render(); }
  if(d.dia!==undefined){
    U.diaSel=d.dia==="null"?null:+d.dia; U.activo=null; U.editEtiqueta=false;
    cargarBorrador(); return render();
  }
  if(d.ej){ U.activo=d.ej; cargarBorrador(); return render(); }
  if(d.graf){ U.ejGrafica=d.graf; return render(); }
  if(d.gf!==undefined){ U.grupoFiltro=d.gf===""?null:d.gf; U.ejGrafica=null; return render(); }
  if(d.gn!==undefined){ U.grupoNuevo=d.gn; return render(); }
  if(d.ir){
    var e=S.ejercicios.filter(function(x){return x.id===d.ir;})[0];
    if(e) U.diaSel=(e.dia===undefined?null:e.dia);
    U.activo=d.ir; cargarBorrador(); return render();
  }
  if(d.corregir){
    var s=S.sesiones.filter(function(x){return x.id===d.corregir;})[0];
    if(s){ U.vista="registrar"; U.fecha=s.fecha; U.activo=s.ejercicioId;
      var ej=S.ejercicios.filter(function(x){return x.id===s.ejercicioId;})[0];
      if(ej) U.diaSel=(ej.dia===undefined?null:ej.dia);
      cargarBorrador(); }
    return render();
  }
  if(d.borrarEj){ return borrarEjercicio(d.borrarEj); }
  if(d.quitar!==undefined){
    var i=+d.quitar;
    U.series = U.series.length===1 ? [{w:"",r:""}] : U.series.filter(function(_,j){return j!==i;});
    return render();
  }
  if(d.uni){ S.unidad=d.uni; guardar(); return render(); }

  switch(d.act){
    case "nuevo": U.nuevo=!U.nuevo; return render();
    case "crear": return crearEjercicio((document.getElementById("nuevoIn")||{}).value);
    case "editEtiqueta": U.editEtiqueta=true; return render();
    case "guardarEtiqueta":
      S.etiquetas[U.diaSel]=((document.getElementById("etiquetaIn")||{}).value||"").trim();
      U.editEtiqueta=false; guardar(); return render();
    case "foto": return document.getElementById("inFoto").click();
    case "quitarFoto": delete S.fotos[U.activo]; guardar(); return render();
    case "masSerie":
      var last=U.series[U.series.length-1]||{w:"",r:""};
      U.series.push({w:last.w,r:last.r}); return render();
    case "guardar": return guardarSesion();
    case "borrarSesion":
      var yy=yaRegistrado(); if(yy) borrarSesion(yy.id); return;
    case "csv": return exportarCSV();
    case "json": return exportarJSON();
    case "restaurar": return document.getElementById("inJson").click();
    case "cerrarLupa": U.lupa=null; return render();
  }
});

/* inputs de series: no re-renderizamos para no perder el foco */
document.addEventListener("input",function(ev){
  var t=ev.target;
  if(t.id==="fechaIn"){ U.fecha=t.value; cargarBorrador(); return render(); }
  if(t.dataset.serie===undefined) return;
  var i=+t.dataset.serie;
  U.series[i][t.dataset.campo]=t.value;
  if(t.dataset.campo==="w"){
    var c=document.getElementById("conv"+i);
    if(c) c.textContent = t.value!=="" ? "= "+equiv(t.value,S.unidad) : "";
  }
  var z=document.getElementById("zonaGuardar");
  if(z) z.innerHTML=zonaGuardar();
});

document.addEventListener("change",function(ev){
  var m=ev.target.dataset.mover;
  var gr=ev.target.dataset.grupo;
  if(!m && !gr) return;
  if(m){
    var e=S.ejercicios.filter(function(x){return x.id===m;})[0];
    if(e){ e.dia = ev.target.value===""?null:+ev.target.value; guardar(); render(); }
  }
  if(gr){
    var e=S.ejercicios.filter(function(x){return x.id===gr;})[0];
    if(e){ e.grupo = ev.target.value||"otro"; guardar(); render(); }
  }
});

document.addEventListener("keydown",function(ev){
  if(ev.key!=="Enter") return;
  if(ev.target.id==="nuevoIn") crearEjercicio(ev.target.value);
  if(ev.target.id==="etiquetaIn"){
    S.etiquetas[U.diaSel]=ev.target.value.trim(); U.editEtiqueta=false; guardar(); render();
  }
});

/* ========== arranque ========== */
cargar();
cargarBorrador();
render();

/* guarda la app en el celular para abrirla sin señal */
if("serviceWorker" in navigator && location.protocol==="https:"){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script>
</body>
</html>
